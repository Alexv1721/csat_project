version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: csat_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: alexv
      MYSQL_DATABASE: gforms
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: csat_api
    restart: always
    depends_on:
      - db
    environment:
      DB_URL: "mysql+pymysql://root:alexv@db:3306/gforms"
      SECRET_KEY: supersecretkey
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      AWS_BUCKET_NAME: gforms2106
      AWS_REGION: ap-south-1
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  db_data:

env_file:
  - .env

